<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
<div class="p-5 mb-5 text-center</> bg-light">
    <h1 class="mb-3">My Blog</h1>
    <h4 class="mb-3">블로그에 오신 것을 환영합니다.</h4>
</div>

<div class="container">
    <div class="mb-4" th:if="${session.loginUser == null}">
        <h4>회원가입</h4>
        <form action="/api/users" method="post">
            <div class="form-group">
                <label>아이디</label>
                <input type="text" name="username" class="form-control">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" name="password" class="form-control">
            </div>
            <button type="submit" class="btn btn-success">회원가입</button>
        </form>
    </div>

    <div class="mb-4" th:if="${session.loginUser == null}">
        <h4>로그인</h4>
        <form action="/api/login" method="post">
            <div class="form-group">
                <label>아이디</label>
                <input type="text" name="username" class="form-control">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" name="password" class="form-control">
            </div>
            <button type="submit" class="btn btn-success">로그인</button>
        </form>
    </div>

    <div class="mb-4" th:if="${session.loginUser != null}">
        <h5><span th:text="${session.loginUser}"></span>님 환영합니다</h5>
        <a href="/api/logout" class="btn btn-danger">로그아웃</a>
    </div>


    <button type="button" class="btn btn-primary btn-sm" th:onclick="|location.href='@{/new-articles}'|">등록</button>

    <!--class="row-6" div를 게시물 개수 만큼 생성 (Model에 저장된 데이터(List)를 확인)-->
    <!--th:each : java의 forEach, 리스트에 값을 순차적으로 꺼내올 수 있음-->
    <!--item : list에서 꺼내온 각 ArticleResponse 객체 (게시물 1개 데이터)-->
    <div class="row-6" th:each="item:${articles}">
        <div class="card">
            <div class="card-header"></div>
            <div class="card-body">
                <h5 class="card-title" th:text="${item.title}"></h5>
                <p class="card-text" th:text="${item.content}"></p>
                <a th:href="@{/articles/{id}(id=${item.id})}" class="btn btn-primary">보러가기</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
